Object.assign(ACTS,{
  pdiff(d){ d=+d; const i=PR.diff.indexOf(d); if(i>=0){ if(PR.diff.length>1) PR.diff.splice(i,1); } else PR.diff.push(d); LS.set('sbq.practice.prefs',PR); practiceSetup(); },
  pchip(n){ n=+n; const i=PR.sel.indexOf(n); if(i>=0) PR.sel.splice(i,1); else PR.sel.push(n); LS.set('sbq.practice.prefs',PR); practiceSetup(); },
  presetprog(){ if(confirm('Delete your saved practice progress in this browser?')){ LS.set('sbq.progress',{}); practiceSetup(); } },
  pstart(){
    let pool=QUESTIONS.filter(q=>PR.sel.includes(q.lec)&&PR.diff.includes(q.diff)); const prog=getProg();
    if(PR.focus){ const f=pool.filter(q=>!(prog[q.id]&&prog[q.id].last)); if(f.length>=3) pool=f; }
    pool=shuffled(pool,Math.random); if(PR.n>0) pool=pool.slice(0,PR.n);
    route={name:'practice', stage:'run', pool, i:0, res:[], seed:Math.random().toString(36).slice(2), sel:null, checked:false};
    count('sessions');
    render(); window.scrollTo(0,0);
  },
  psel(i){ if(route.checked) return; route.sel=+i; practiceRun(true); },
  pcheck(){
    if(route.sel==null||route.checked) return; const q=route.pool[route.i]; const ok=route.sel===correctOf(q);
    route.checked=true; route.res.push({id:q.id, ok});
    if(!route.retry){ count('q.'+q.id+'.n'); if(ok) count('q.'+q.id+'.ok'); }   // anonymous totals (retry rounds not counted)
    const prog=getProg(), p=prog[q.id]||{n:0,c:0}; p.n++; if(ok)p.c++; p.last=ok; prog[q.id]=p; LS.set('sbq.progress',prog);
    practiceRun(true);
  },
  pnext(){ if(route.i+1>=route.pool.length){ route.stage='done'; render(); window.scrollTo(0,0); } else { route.i++; route.sel=null; route.checked=false; practiceRun(); window.scrollTo(0,0); } },
  pretry(){ const wrong=route.res.filter(r=>!r.ok).map(r=>byId[r.id]); route={name:'practice',stage:'run',pool:shuffled(wrong,Math.random),i:0,res:[],seed:Math.random().toString(36).slice(2),sel:null,checked:false,retry:true}; render(); },
  pagain(){ go({name:'practice',stage:'setup'}); },
});

function practiceRun(keepScroll){
  const R=route, q=R.pool[R.i], ord=optOrder(q,R.seed), cor=correctOf(q);
  const opts=ord.map((oi,pos)=>{
    let cls='opt'; if(R.checked){ if(oi===cor) cls+=' ok'; else if(oi===R.sel) cls+=' bad'; else cls+=' dim'; } else if(R.sel===oi) cls+=' sel';
    return '<button class="'+cls+'" data-act="psel" data-arg="'+oi+'"'+(R.checked?' disabled':'')+'><span class="k">'+LETTERS[pos]+'</span><span class="t">'+q.opts[oi]+'</span></button>';
  }).join('');
  let fb=''; if(R.checked){ const ok=R.sel===cor; fb='<div class="feedback '+(ok?'ok':'bad')+'"><h3>'+(ok?'✓ Correct':'✗ Not quite — correct answer: '+LETTERS[ord.indexOf(cor)])+'</h3><div>'+(q.exp||'')+'</div>'+(q.src?'<div class="src">Modelled on: '+esc(q.src)+'</div>':'')+'</div>'; }
  const last=R.i+1>=R.pool.length;
  app.innerHTML='<div class="wrap">'+header('<span class="pill">'+(R.i+1)+' / '+R.pool.length+'</span>')+
    '<div class="progress" style="margin-bottom:16px"><i style="width:'+Math.round(100*(R.i+(R.checked?1:0))/R.pool.length)+'%"></i></div>'+
    '<div class="card"><div class="qmeta">'+esc(lecLabel(q.lec))+' · '+esc(q.topic)+diffTag(q)+'</div><div class="qtext">'+q.q+'</div>'+figHTML(q)+'<div class="opts">'+opts+'</div>'+fb+
    '<div class="row spread" style="margin-top:18px"><button class="btn ghost" data-act="home">Quit</button>'+
    (R.checked?'<button class="btn primary big" data-act="pnext">'+(last?'See results':'Next question →')+'</button>':'<button class="btn primary big" data-act="pcheck"'+(R.sel==null?' disabled':'')+'>Check answer</button>')+'</div></div></div>';
  typeset(app);
  document.onkeydown=e=>{
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    const k=e.key.toUpperCase(), pos=LETTERS.indexOf(k), n=parseInt(e.key,10);
    if(!R.checked){ const p = pos>=0&&pos<ord.length ? pos : (n>=1&&n<=ord.length ? n-1 : -1); if(p>=0){ ACTS.psel(ord[p]); return; } }
    if(e.key==='Enter'){ e.preventDefault(); R.checked?ACTS.pnext():ACTS.pcheck(); }
  };
}
function practiceDone(){
  const R=route, ok=R.res.filter(r=>r.ok).length, tot=R.res.length, wrong=R.res.filter(r=>!r.ok);
  const pct=Math.round(100*ok/Math.max(1,tot));
  const items=R.res.map(r=>{const q=byId[r.id]; return '<div class="li '+(r.ok?'ok':'bad')+'"><span class="m">'+(r.ok?'✓':'✗')+'</span><div><b>'+esc(lecLabel(q.lec))+'</b> · '+esc(q.topic)+'</div></div>';}).join('');
  app.innerHTML='<div class="wrap">'+header()+'<div class="stack"><div class="card" style="text-align:center"><div class="muted">Your result</div><div class="big-score">'+ok+' / '+tot+'</div><div class="muted">'+pct+' % correct</div>'+
   '<div class="row" style="justify-content:center;margin-top:18px">'+(wrong.length?'<button class="btn primary" data-act="pretry">Retry the '+wrong.length+' I missed</button>':'')+'<button class="btn" data-act="pagain">New session</button><button class="btn ghost" data-act="home">Home</button></div></div>'+
   '<div class="list">'+items+'</div></div></div>';
}

/* ====================================================================
   LIVE: STUDENT
   ==================================================================== */
let S=null;
const sid = () => { let v=LS.get('sbq.sid',null); if(!v){ v=Math.random().toString(36).slice(2,10)+Date.now().toString(36); LS.set('sbq.sid',v);} return v; };
function viewLive(){
  S={code:route.code, sid:sid(), cl:null, st:null, mine:{}, rv:null, hostOn:null, status:'connecting', stage:1, sel:null, pendingSince:0, dead:false, retryT:null, bi:0, lastPing:0};
  studentConnect(); studentPaint();
}
function studentLeave(){
  if(!S) return; S.dead=true; clearTimeout(S.retryT); clearTimeout(S.hostT); clearInterval(S.tick);
  try{ if(S.cl){ if(S.cl.connected) S.cl.publish(topic(S.code,'p'),enc({t:'bye',sid:S.sid,cid:S.cid})); S.cl.end(); } }catch(e){}
  document.removeEventListener('visibilitychange',S.vis); S=null;
}
function spub(t,o,qos){ try{ if(S&&S.cl&&S.cl.connected){ S.cl.publish(topic(S.code,t),enc(o),{qos:qos||0}); return true; } }catch(e){} return false; }
function studentUpd(){
  if(!S) return; const c=S.cl&&S.cl.connected;
  S.status = c ? (S.hostOn ? 'on' : 'wait') : (S.everConnected ? 'retry' : 'connecting');
  S.stage = c ? 2 : 1;
  if(S.status==='on') S.err='';
}
function studentHello(){ if(spub('p',{t:'hello',sid:S.sid,cid:S.cid,ver:VER},1)) S.lastPing=Date.now(); }
function studentConnect(){
  if(!S||S.dead) return;
  if(!window.mqtt){ S.status='error'; S.err='The connection library could not be loaded (check your internet connection).'; studentPaint(); S.retryT=setTimeout(()=>{ if(S&&!S.dead) studentConnect(); },4000); return; }
  const me=S; try{ me.cl&&me.cl.end(true); }catch(e){}
  if(me.bi>=BROKERS.length) me.bi=0;
  const url=BROKERS[me.bi]; let first=false, failed=false; me.cid=Math.random().toString(36).slice(2,8);
  me.everConnected=false; studentUpd(); studentPaint();
  const cl=mqtt.connect(url,{clientId:'sbq_'+me.sid.slice(0,12)+'_'+Math.random().toString(36).slice(2,7), clean:true, keepalive:30,
    connectTimeout:7000, reconnectPeriod:0, protocolVersion:4, will:{topic:topic(me.code,'p'), payload:enc({t:'bye',sid:me.sid,cid:me.cid}), qos:0, retain:false}});
  me.cl=cl;
  const fail=()=>{
    if(first||failed||S!==me||me.dead||me.cl!==cl) return; failed=true; clearTimeout(t1); try{cl.end(true);}catch(e){}
    me.bi++;
    if(me.bi<BROKERS.length) studentConnect();
    else { me.bi=0; me.err='Step 1 failed: cannot reach the message service ('+BROKERS.map(hostOf).join(', ')+'). The network may block it — try mobile data or another Wi-Fi.'; studentPaint(); clearTimeout(me.retryT); me.retryT=setTimeout(studentConnect,4000); }
  };
  const t1=setTimeout(fail,9000);
  cl.on('connect',()=>{
    if(S!==me||me.cl!==cl) return; first=true; me.everConnected=true; clearTimeout(t1); cl.options.reconnectPeriod=2000;
    cl.subscribe([topic(me.code,'state'),topic(me.code,'host'),topic(me.code,'s/'+me.sid)],{qos:1});
    studentHello(); studentUpd(); studentPaint();
    clearTimeout(me.hostT);
    me.hostT=setTimeout(()=>{ if(S===me && me.hostOn!==true){ me.err='Step 2: connected to the message service, but the lecturer’s page for room “'+me.code+'” is not online. Check the code, or wait until the lecturer opens the page.'; studentPaint(); } },6000);
  });
  cl.on('message',(t,b)=>{
    if(S!==me) return; const m=dec(b), k=t.slice(topic(me.code,'').length);
    if(k==='host'){ const was=me.hostOn; me.hostOn=!!(m&&m.on); if(me.hostOn&&!was) studentHello(); studentUpd(); studentPaint(true); }
    else if(k==='state'){ if(m) studentState(m); }
    else if(k==='s/'+me.sid){ if(m&&m.qid){ if(m.mine!=null) me.mine[m.qid]=m.mine; if(me.st&&me.st.qid===m.qid&&m.mine!=null){ me.st.mine=m.mine; me.pendingSince=0; studentPaint(); } } }
  });
  cl.on('close',()=>{ if(!first){ fail(); return; } if(S===me){ studentUpd(); if(me.status!=='on'){ me.err='Connection lost — reconnecting…'; } studentPaint(); } });
  cl.on('error',()=>{ if(!first) fail(); });
  if(!S.vis){ S.vis=()=>{ if(S&&!S.dead&&document.visibilityState==='visible'&&!(S.cl&&S.cl.connected)){ clearTimeout(S.retryT); if(S.everConnected){ try{S.cl.reconnect();}catch(e){ studentConnect(); } } else studentConnect(); } }; document.addEventListener('visibilitychange',S.vis); }
  if(!S.tick) S.tick=setInterval(()=>{
    if(!S) return; const now=Date.now();
    if(S.status==='on'&&S.pendingSince&&now-S.pendingSince>3000&&S.sel!=null&&S.st&&S.st.mine==null&&S.st.phase==='q'){ spub('a',{sid:S.sid,qid:S.st.qid,choice:S.sel},1); S.pendingSince=now; }
    if(now-S.lastPing>20000 && spub('p',{t:'ping',sid:S.sid,cid:S.cid})) S.lastPing=now;   // presence heartbeat
  },1000);
}
function studentState(m){
  const prevQ=S.st&&S.st.qid, prevPhase=S.st&&S.st.phase;
  if(m.rv!==S.rv){ if(S.rv!=null) S.mine={}; S.rv=m.rv; }        // lecturer cleared the answers
  m.mine = (m.qid && S.mine[m.qid]!=null) ? S.mine[m.qid] : null;
  S.st=m; if(m.qid!==prevQ){ S.sel=null; S.pendingSince=0; window.scrollTo(0,0); }
  if(m.mine!=null) S.pendingSince=0;
  studentPaint(m.qid!==prevQ || m.phase!==prevPhase);
}
function studentPaint(full){
  if(!S||route.name!=='live') return;
  const dotCls = S.status==='on'?'on':(S.status==='error'?'off':'wait');
  const stxt = S.status==='on'?'Connected':(S.status==='connecting'?'Connecting…':(S.status==='wait'?'Waiting for lecturer':(S.status==='error'?'Error':'Reconnecting…')));
  let body='';
  const st=S.st;
  if(st && st.ver!==VER) body+='<div class="banner">Your page is out of date. Please reload it (pull down, or hard-refresh) to see the current question.</div>';
  if(S.err && S.status!=='on') body+='<div class="banner warn">'+esc(S.err)+'</div>';
  if(!st || !S.hostOn || st.phase==='lobby' || !byId[st.qid]){
    body+='<div class="card wait"><div class="spin"></div><h2>'+(S.status==='on'?'You’re in!':'Connecting…')+'</h2><p class="muted">'+(S.status==='on'?'Waiting for the lecturer to start the next question…':'Room '+esc(S.code)+'<br>'+(S.stage===2?'Step 2 of 2: waiting for the lecturer’s page…':'Step 1 of 2: reaching the message service…'))+'</p></div>';
  } else {
    const q=byId[st.qid], ord=optOrder(q,''), cor=correctOf(q), mine=st.mine, locked=mine!=null || (S.pendingSince>0);
    const reveal=st.phase==='r';
    const myChoice = mine!=null?mine:S.sel;
    const counts=st.counts||[], tot=counts.reduce((a,b)=>a+b,0);
    const opts=ord.map((oi,pos)=>{
      let cls='opt'+(reveal&&tot?' stat':'');
      if(reveal){ if(oi===cor) cls+=' ok'; else if(oi===myChoice) cls+=' bad'; else cls+=' dim'; }
      else if(myChoice===oi) cls+=' sel';
      const pct=tot?Math.round(100*(counts[oi]||0)/tot):0;
      return '<button class="'+cls+'" style="--pct:'+pct+'%" data-act="lsel" data-arg="'+oi+'"'+((reveal||locked)?' disabled':'')+'><span class="k">'+LETTERS[pos]+'</span><span class="t">'+q.opts[oi]+'</span>'+(reveal&&tot?'<span class="cnt">'+pct+'%</span>':'')+'</button>';
    }).join('');
    let foot='';
    if(reveal){
      const ok=mine!=null&&mine===cor, noans=mine==null; const correctN=counts[cor]||0;
      foot='<div class="feedback '+(noans?'':ok?'ok':'bad')+'"><h3>'+(noans?'No answer submitted':ok?'✓ Correct':'✗ Not quite — correct answer: '+LETTERS[ord.indexOf(cor)])+'</h3>'+(tot?'<div class="muted" style="margin-bottom:8px">'+correctN+' of '+tot+' answers were correct ('+Math.round(100*correctN/tot)+' %)</div>':'')+'<div>'+(q.exp||'')+'</div></div>';
    } else if(locked){

function commonState(){

function personal(s){ const q=hostQ(); if(!q) return; const a=H.answers[q.id]||{}; hpub('s/'+s,{qid:q.id, mine:(s in a)?a[s]:null}); }

const presentCount = () => { if(!H) return 0; const lim=Date.now()-50000; let n=0; H.pres.forEach(e=>{ if(e.t>lim) n++; }); return n; };
function hostMsg(k,m){

    html+='<div class="overlay" data-act="hclose"><div class="modal"><div class="row spread" style="margin-bottom:12px"><h2>Questions</h2><div class="row"><button class="btn" data-act="hcsv">Download results (CSV)</button><button class="btn" data-act="hlobby">Lobby / QR</button><button class="btn primary" data-act="hclose">Close</button></div></div><div class="row" style="margin-bottom:12px"><span class="muted small">'+planSummary()+'</span><button class="btn" data-act="hsetup">Change questions…</button></div><div class="qlist">'+items+'</div><p class="muted small" style="margin-top:14px"><button class="link" data-act="hreset">Clear collected answers</button></p></div></div>';
  }
  const oldM=app.querySelector('.modal'), keep=oldM?oldM.scrollTop:0;
  app.innerHTML=html; hostStatus(); hostCount(); typeset(app);
  const newM=app.querySelector('.modal'); if(newM&&keep) newM.scrollTop=keep;
}
const lecShort = n => n===7 ? 'More topics' : 'L'+n;
function planSummary(){
  const c=H.cfg, n=H.plan.length, lecs=[...new Set(hostList().map(q=>q.lec))].sort((a,b)=>a-b).map(lecShort).join(', ');
  if(!n) return '<b>No questions selected</b>';
  const dl=(c.diff||[1,2,3]).length<3 ? ' · '+(c.diff||[]).slice().sort().map(d=>DIFF[d]).join(' + ') : '';
  return '<b>'+n+' question'+(n>1?'s':'')+'</b> · '+(c.mode==='pick'?'chosen by hand':'random draw')+(lecs?' from '+esc(lecs):'')+dl+(c.order==='shuffle'?' · shuffled order':'');
}
function qStat(id){ const a=H.answers[id], n=a?Object.keys(a).length:0; if(!n) return ''; const q=byId[id], k=counts(q)[correctOf(q)]; return '<span class="st" title="asked before">asked · '+Math.round(100*k/n)+' % of '+n+'</span>'; }
function setupRow(q, on, act){
  return '<button class="sq'+(on?' on':'')+'"'+(act?' data-act="hpick" data-arg="'+q.id+'"':'')+'>'+(act?'<span class="cb">'+(on?'✓':'')+'</span>':'')+
    '<span class="sqm"><span class="id">'+q.id+'</span> <b>'+esc(q.topic)+'</b>'+diffTag(q)+qStat(q.id)+'<span class="sqt">'+q.q+'</span></span></button>';
}
function setupHTML(){
  const c=H.cfg, pool=hostPool();
  const seg=(act,val,cur,label)=>'<button class="seg'+(String(val)===String(cur)?' on':'')+'" data-act="'+act+'" data-arg="'+val+'">'+label+'</button>';
  const chips=lecNums.map(n=>{ const k=QUESTIONS.filter(x=>x.lec===n).length; if(!k) return ''; return '<button class="chip'+(c.sel.includes(n)?' on':'')+'" data-act="hchip" data-arg="'+n+'"><b>'+esc(lecLabel(n))+'</b><span>'+k+' questions</span></button>'; }).join('');
  let h='<div class="row spread" style="margin-bottom:14px"><h2>Choose questions</h2><button class="btn primary" data-act="hsetupdone">Done</button></div>'+
    '<div class="muted small slab">Lectures</div><div class="chips">'+chips+'</div>'+
    '<div class="muted small slab">Difficulty</div><div class="segs">'+[1,2,3].map(d=>'<button class="seg'+((c.diff||[1,2,3]).includes(d)?' on':'')+'" data-act="hdiff" data-arg="'+d+'">'+'●'.repeat(d)+' '+DIFF[d]+' ('+QUESTIONS.filter(q=>c.sel.includes(q.lec)&&q.diff===d).length+')</button>').join('')+'</div>'+
    '<div class="muted small slab">How to choose</div><div class="segs">'+seg('hmode','random',c.mode,'Random selection')+seg('hmode','pick',c.mode,'Pick questions myself')+'</div>';
  if(c.mode==='random'){
    h+='<div class="muted small slab">Number of questions</div><div class="segs">'+N_CHOICES.map(v=>seg('hn',v,c.n,v?String(v):'All ('+pool.length+')')).join('')+'</div>'+
      '<div class="row" style="margin-top:12px"><button class="toggle link-like" data-act="hfresh"><span class="cb'+(c.fresh?' on':'')+'">'+(c.fresh?'✓':'')+'</span>Prefer questions not asked yet</button></div>';
  }
  h+='<div class="muted small slab">Order</div><div class="segs">'+seg('horder','lec',c.order,'Lecture order')+seg('horder','shuffle',c.order,'Shuffled')+'</div>';
  if(c.mode==='random'){
    h+='<div class="row spread slab"><span><b>'+H.plan.length+'</b> drawn questions</span><span class="row"><button class="btn" data-act="hdraw">↻ Draw again</button><button class="btn ghost" data-act="htopick" title="Switch to manual selection, starting from this draw">Edit by hand</button></span></div>'+
      '<div class="sqlist">'+(hostList().map(q=>setupRow(q,true,false)).join('')||'<p class="muted">Select at least one lecture.</p>')+'</div>';
  } else {
    h+='<div class="row spread slab"><span><b>'+H.plan.length+'</b> selected</span><button class="btn ghost" data-act="hpicknone">Clear selection</button></div><div class="sqlist">';
    lecNums.filter(n=>c.sel.includes(n)).forEach(n=>{ const qs=pool.filter(q=>q.lec===n); if(!qs.length) return;
      const k=qs.filter(q=>c.picks.includes(q.id)).length;
      h+='<div class="sqh"><b>'+esc(lecLabel(n))+'</b><span class="muted small">'+k+' / '+qs.length+'</span><button class="link" data-act="hpickall" data-arg="'+n+'">'+(k===qs.length?'none':'all')+'</button></div>'+
        qs.map(q=>setupRow(q,c.picks.includes(q.id),true)).join('');
    });
    h+=(pool.length?'':'<p class="muted">Select at least one lecture.</p>')+'</div>';
  }
  if(H.phase!=='lobby') h+='<p class="muted small" style="margin-top:12px">The session is running — changes apply to the remaining questions; collected answers are kept.</p>';
  return h;
}

/* ====================================================================
   STATISTICS  (#stats) — reads the anonymous Abacus counters
   ==================================================================== */
let STL=null, STATS_VIEW={t:0,v:{}};   // running loader, data currently shown
function viewStats(){
  document.title=TITLE+' Quiz · Statistics';
  const C=LS.get('sbq.stats',{t:0,v:{}}); route.sort=route.sort||'lec';
  statsPaint(C);
  if(!STATS_NS) return;
  if(!STL) statsLoad();
}
async function statsLoad(){
  const me=STL={done:0,total:2+QUESTIONS.length,err:''}, v=Object.assign({}, LS.get('sbq.stats',{v:{}}).v);
  const get=async key=>{
    for(let tries=0;tries<6;tries++){
      try{
        const r=await fetch(STATS_URL+'/get/'+STATS_NS+'/'+key,{cache:'no-store'});
        if(r.status===404) return 0;
        if(r.status===429){ const w=+(r.headers.get('Retry-After')||10); me.err='Waiting for the counting service (rate limit)…'; statsPaintLive(v); await new Promise(z=>setTimeout(z,(w+1)*1000)); me.err=''; continue; }
        if(!r.ok) throw new Error('HTTP '+r.status);
        const j=await r.json(); return +j.value||0;
      }catch(e){ me.err='Counting service not reachable ('+e.message+') — retrying…'; statsPaintLive(v); await new Promise(z=>setTimeout(z,3000)); }
    }
    return null;
  };
  const pace=()=>new Promise(z=>setTimeout(z,420));        // stay below 30 requests per 10 s
  const alive=()=>STL===me && route.name==='stats';
  for(const k of ['visits','sessions']){ if(!alive()) return; v[k]=await get(k); me.done++; await pace(); }
  for(const q of QUESTIONS){
    if(!alive()) return;
    const n=await get('q.'+q.id+'.n'); await pace();
    v['q.'+q.id+'.n']=n; v['q.'+q.id+'.ok']= n ? await get('q.'+q.id+'.ok') : 0; if(n) await pace();
    me.done++; if(me.done%5===0) statsPaintLive(v);
  }
  if(STL!==me) return;
  STL=null; const C={t:Date.now(),v}; LS.set('sbq.stats',C); if(route.name==='stats') statsPaint(C);
}
function statsPaintLive(v){ if(route.name==='stats') statsPaint({t:STATS_VIEW.t,v}); }
function statsPaint(C){
  STATS_VIEW=C; const v=C.v||{}, has=k=>v[k]!=null, val=k=>v[k]||0;
  const pct=(a,b)=>b?Math.round(100*a/b)+' %':'–';
  let N=0,K=0; const per={};
  QUESTIONS.forEach(q=>{ const n=val('q.'+q.id+'.n'), k=Math.min(n,val('q.'+q.id+'.ok')); N+=n; K+=k; const L=per[q.lec]||(per[q.lec]={n:0,k:0}); L.n+=n; L.k+=k; });
  const tiles=[['Page visits',has('visits')?val('visits'):'…'],['Practice sessions',has('sessions')?val('sessions'):'…'],['Questions answered',N],['Answered correctly',pct(K,N)]]
    .map(([l,x])=>'<div class="card st-tile"><div class="muted small">'+l+'</div><div class="st-big">'+x+'</div></div>').join('');
  const bar=(k,n)=>n?'<div class="bar st-bar"><i style="width:'+Math.round(100*k/n)+'%"></i></div>':'';
  const lecRows=lecNums.map(n=>{ const L=per[n]||{n:0,k:0}; return '<tr><td>'+esc(lecLabel(n))+'</td><td class="num">'+L.n+'</td><td class="num">'+pct(L.k,L.n)+'</td><td>'+bar(L.k,L.n)+'</td></tr>'; }).join('');
  let qs=QUESTIONS.slice();
  if(route.sort==='hard') qs.sort((a,b)=>{ const f=q=>{ const n=val('q.'+q.id+'.n'); return n? val('q.'+q.id+'.ok')/n : 2; }; return f(a)-f(b); });
  if(route.sort==='most') qs.sort((a,b)=>val('q.'+b.id+'.n')-val('q.'+a.id+'.n'));
  const qRows=qs.map(q=>{ const n=val('q.'+q.id+'.n'), k=Math.min(n,val('q.'+q.id+'.ok')); const loaded=has('q.'+q.id+'.n');
    return '<tr><td class="mono">'+q.id+'</td><td>'+esc(q.topic)+'</td><td>'+diffTag(q)+'</td><td class="num">'+(loaded?n:'…')+'</td><td class="num">'+pct(k,n)+'</td><td>'+bar(k,n)+'</td></tr>'; }).join('');
  const seg=(val2,label)=>'<button class="seg'+(route.sort===val2?' on':'')+'" data-act="ssort" data-arg="'+val2+'">'+label+'</button>';
  const status = !STATS_NS ? 'Counting is switched off (STATS_NS is empty).'
    : STL ? 'Loading… '+STL.done+' / '+STL.total+(STL.err?' · '+esc(STL.err):' · the free counting service allows ~30 requests per 10 s, so this takes about a minute.')
    : C.t ? 'Updated '+new Date(C.t).toLocaleString()+' · <button class="link" data-act="sreload">Reload</button>' : '';
  app.innerHTML='<div class="wrap">'+header()+'<h1 style="margin-bottom:6px">Practice statistics</h1><p class="muted small">Anonymous totals from the self-study mode (live sessions are not included; repeat rounds of wrong answers are not counted). '+status+'</p>'+
    '<div class="st-tiles">'+tiles+'</div>'+
    '<h2 class="st-h">By lecture</h2><div class="card st-tbl"><table><tr><th>Lecture</th><th class="num">Answers</th><th class="num">Correct</th><th></th></tr>'+lecRows+'</table></div>'+
    '<div class="row spread st-h"><h2>By question</h2><div class="segs">'+seg('lec','Lecture order')+seg('hard','Lowest % correct first')+seg('most','Most answered')+'</div></div>'+
    '<div class="card st-tbl"><table><tr><th>ID</th><th>Topic</th><th>Level</th><th class="num">Answers</th><th class="num">Correct</th><th></th></tr>'+qRows+'</table></div></div>';
}
Object.assign(ACTS,{
  ssort(v){ route.sort=v; statsPaint(STATS_VIEW); },
  sreload(){ if(!STL) statsLoad(); statsPaint(STATS_VIEW); },
});

/* ====================================================================
   START
   ==================================================================== */
const start=bootRoute;
if(document.readyState==='loading') window.addEventListener('DOMContentLoaded', start); else start();
window.addEventListener('popstate', ()=>{ cleanup(); bootRoute(); });
})();
</script>
