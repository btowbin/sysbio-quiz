/* ====================================================================
   PRACTICE MODE
   ==================================================================== */
const PR = LS.get('sbq.practice.prefs', {sel:[1,2,3,4,5,6,7], n:10, focus:false, shuffleQ:true});
const getProg = () => LS.get('sbq.progress', {});
function viewPractice(){ if(route.stage==='setup') practiceSetup(); else if(route.stage==='run') practiceRun(); else practiceDone(); }

function practiceSetup(){
  const prog=getProg();
  const chips = lecNums.map(n=>{
    const qs=QUESTIONS.filter(q=>q.lec===n); if(!qs.length) return '';
    const mastered=qs.filter(q=>prog[q.id]&&prog[q.id].last).length, on=PR.sel.includes(n);
    return '<button class="chip'+(on?' on':'')+'" data-act="pchip" data-arg="'+n+'"><b>'+esc(lecLabel(n))+'</b><span>'+qs.length+' questions · '+mastered+' answered correctly</span><div class="bar"><i style="width:'+Math.round(100*mastered/qs.length)+'%"></i></div></button>';
  }).join('');
  const total = QUESTIONS.filter(q=>PR.sel.includes(q.lec)).length;
  app.innerHTML='<div class="wrap">'+header()+'<div class="stack"><div><h2>Practice</h2><p class="muted" style="margin:6px 0 0">Choose the lectures you want to be quizzed on.</p></div>'+
   '<div class="chips">'+chips+'</div>'+
   '<div class="card stack"><div class="row"><div class="field"><label for="nq">Number of questions</label><select id="nq">'+[5,10,20,0].map(v=>'<option value="'+v+'"'+(PR.n===v?' selected':'')+'>'+(v||'All')+'</option>').join('')+'</select></div></div>'+
   '<label class="toggle"><input type="checkbox" id="focus"'+(PR.focus?' checked':'')+'><span>Focus on questions I have not seen or got wrong last time</span></label>'+
   '<div class="row spread"><span class="muted">'+total+' questions available</span><button class="btn primary big" data-act="pstart"'+(total?'':' disabled')+'>Start</button></div></div>'+
   '<p class="muted small"><button class="link" data-act="presetprog">Reset my progress</button></p></div></div>';
  document.getElementById('nq').onchange=e=>{PR.n=+e.target.value; LS.set('sbq.practice.prefs',PR);};
  document.getElementById('focus').onchange=e=>{PR.focus=e.target.checked; LS.set('sbq.practice.prefs',PR);};
}
Object.assign(ACTS,{
  pchip(n){ n=+n; const i=PR.sel.indexOf(n); if(i>=0) PR.sel.splice(i,1); else PR.sel.push(n); LS.set('sbq.practice.prefs',PR); practiceSetup(); },
  presetprog(){ if(confirm('Delete your saved practice progress in this browser?')){ LS.set('sbq.progress',{}); practiceSetup(); } },
  pstart(){
    let pool=QUESTIONS.filter(q=>PR.sel.includes(q.lec)); const prog=getProg();
    if(PR.focus){ const f=pool.filter(q=>!(prog[q.id]&&prog[q.id].last)); if(f.length>=3) pool=f; }
    pool=shuffled(pool,Math.random); if(PR.n>0) pool=pool.slice(0,PR.n);
    route={name:'practice', stage:'run', pool, i:0, res:[], seed:Math.random().toString(36).slice(2), sel:null, checked:false};
    render(); window.scrollTo(0,0);
  },
  psel(i){ if(route.checked) return; route.sel=+i; practiceRun(true); },
  pcheck(){
    if(route.sel==null||route.checked) return; const q=route.pool[route.i]; const ok=route.sel===correctOf(q);
    route.checked=true; route.res.push({id:q.id, ok});
    const prog=getProg(), p=prog[q.id]||{n:0,c:0}; p.n++; if(ok)p.c++; p.last=ok; prog[q.id]=p; LS.set('sbq.progress',prog);
    practiceRun(true);
  },
  pnext(){ if(route.i+1>=route.pool.length){ route.stage='done'; render(); window.scrollTo(0,0); } else { route.i++; route.sel=null; route.checked=false; practiceRun(); window.scrollTo(0,0); } },
  pretry(){ const wrong=route.res.filter(r=>!r.ok).map(r=>byId[r.id]); route={name:'practice',stage:'run',pool:shuffled(wrong,Math.random),i:0,res:[],seed:Math.random().toString(36).slice(2),sel:null,checked:false}; render(); },
  pagain(){ go({name:'practice',stage:'setup'}); },
});

function practiceRun(keepScroll){
  const R=route, q=R.pool[R.i], ord=optOrder(q,R.seed), cor=correctOf(q);
  const opts=ord.map((oi,pos)=>{
    let cls='opt'; if(R.checked){ if(oi===cor) cls+=' ok'; else if(oi===R.sel) cls+=' bad'; else cls+=' dim'; } else if(R.sel===oi) cls+=' sel';
    return '<button class="'+cls+'" data-act="psel" data-arg="'+oi+'"'+(R.checked?' disabled':'')+'><span class="k">'+LETTERS[pos]+'</span><span class="t">'+q.opts[oi]+'</span></button>';
  }).join('');
  let fb=''; if(R.checked){ const ok=R.sel===cor; fb='<div class="feedback '+(ok?'ok':'bad')+'"><h3>'+(ok?'✓ Correct':'✗ Not quite — correct answer: '+LETTERS[ord.indexOf(cor)])+'</h3><div>'+(q.exp||'')+'</div>'+(q.src?'<div class="src">Modelled on: '+esc(q.src)+'</div>':'')+'</div>'; }
  const last=R.i+1>=R.pool.length;
  app.innerHTML='<div class="wrap">'+header('<span class="pill">'+(R.i+1)+' / '+R.pool.length+'</span>')+
    '<div class="progress" style="margin-bottom:16px"><i style="width:'+Math.round(100*(R.i+(R.checked?1:0))/R.pool.length)+'%"></i></div>'+
    '<div class="card"><div class="qmeta">'+esc(lecLabel(q.lec))+' · '+esc(q.topic)+'</div><div class="qtext">'+q.q+'</div>'+figHTML(q)+'<div class="opts">'+opts+'</div>'+fb+
    '<div class="row spread" style="margin-top:18px"><button class="btn ghost" data-act="home">Quit</button>'+
    (R.checked?'<button class="btn primary big" data-act="pnext">'+(last?'See results':'Next question →')+'</button>':'<button class="btn primary big" data-act="pcheck"'+(R.sel==null?' disabled':'')+'>Check answer</button>')+'</div></div></div>';
  typeset(app);
  document.onkeydown=e=>{
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    const k=e.key.toUpperCase(), pos=LETTERS.indexOf(k), n=parseInt(e.key,10);
    if(!R.checked){ const p = pos>=0&&pos<ord.length ? pos : (n>=1&&n<=ord.length ? n-1 : -1); if(p>=0){ ACTS.psel(ord[p]); return; } }
    if(e.key==='Enter'){ e.preventDefault(); R.checked?ACTS.pnext():ACTS.pcheck(); }
  };
}
function practiceDone(){
  const R=route, ok=R.res.filter(r=>r.ok).length, tot=R.res.length, wrong=R.res.filter(r=>!r.ok);
  const pct=Math.round(100*ok/Math.max(1,tot));
  const items=R.res.map(r=>{const q=byId[r.id]; return '<div class="li '+(r.ok?'ok':'bad')+'"><span class="m">'+(r.ok?'✓':'✗')+'</span><div><b>'+esc(lecLabel(q.lec))+'</b> · '+esc(q.topic)+'</div></div>';}).join('');
  app.innerHTML='<div class="wrap">'+header()+'<div class="stack"><div class="card" style="text-align:center"><div class="muted">Your result</div><div class="big-score">'+ok+' / '+tot+'</div><div class="muted">'+pct+' % correct</div>'+
   '<div class="row" style="justify-content:center;margin-top:18px">'+(wrong.length?'<button class="btn primary" data-act="pretry">Retry the '+wrong.length+' I missed</button>':'')+'<button class="btn" data-act="pagain">New session</button><button class="btn ghost" data-act="home">Home</button></div></div>'+
   '<div class="list">'+items+'</div></div></div>';
}

/* ====================================================================
   LIVE: STUDENT
   ==================================================================== */
let S=null;
const sid = () => { let v=LS.get('sbq.sid',null); if(!v){ v=Math.random().toString(36).slice(2,10)+Date.now().toString(36); LS.set('sbq.sid',v);} return v; };
function viewLive(){
  S={code:route.code, sid:sid(), peer:null, conn:null, st:null, status:'connecting', sel:null, pendingSince:0, dead:false, retryT:null};
  studentConnect(); studentPaint();
}
function studentLeave(){ if(!S) return; S.dead=true; clearTimeout(S.retryT); clearInterval(S.tick); try{S.conn&&S.conn.close();}catch(e){} try{S.peer&&S.peer.destroy();}catch(e){} document.removeEventListener('visibilitychange',S.vis); S=null; }
function studentConnect(){
  if(!S||S.dead) return;
  if(!window.Peer){ S.status='error'; S.err='The connection library could not be loaded (check your internet connection).'; studentPaint(); S.retryT=setTimeout(()=>{ if(S&&!S.dead) studentConnect(); },4000); return; }
  S.status='connecting'; S.err=''; studentPaint();
  try{ S.peer&&S.peer.destroy(); }catch(e){}
  const me=S, peer=new Peer(undefined, peerOpts()); S.peer=peer;
  let opened=false;
  const retry=(msg,delay)=>{ if(me.dead||S!==me) return; if(msg) me.err=msg; me.status='retry'; studentPaint(); clearTimeout(me.retryT); me.retryT=setTimeout(()=>studentConnect(),delay||2500); };
  peer.on('open',()=>{
    const conn=peer.connect(PEER_PREFIX+me.code,{reliable:true,serialization:'json'}); me.conn=conn;
    const to=setTimeout(()=>{ if(!opened){ try{conn.close();}catch(e){} retry('Could not reach the lecturer’s page yet — retrying…',2000);} },12000);
    conn.on('open',()=>{ opened=true; clearTimeout(to); me.status='on'; me.err=''; conn.send({t:'hello',sid:me.sid,ver:VER}); studentPaint(); });
    conn.on('data',m=>{ if(m&&m.t==='state') studentState(m); });
    conn.on('close',()=>{ clearTimeout(to); retry('Connection lost — reconnecting…',1500); });
    conn.on('error',()=>{ clearTimeout(to); retry('Connection problem — retrying…',2500); });
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable') retry('Room “'+me.code+'” not found. Check the code — or the lecturer has not started yet.',3000);
    else retry('Network problem ('+e.type+') — retrying…',3000);
  });
  peer.on('disconnected',()=>{ try{peer.reconnect();}catch(e){} });
  if(!S.vis){ S.vis=()=>{ if(S&&!S.dead&&document.visibilityState==='visible'&&S.status!=='on') { clearTimeout(S.retryT); studentConnect(); } }; document.addEventListener('visibilitychange',S.vis); }
  if(!S.tick) S.tick=setInterval(()=>{ // resend answer if not acknowledged
    if(S&&S.status==='on'&&S.pendingSince&&Date.now()-S.pendingSince>3000&&S.sel!=null&&S.st&&S.st.mine==null&&S.st.phase==='q'){ try{S.conn.send({t:'answer',sid:S.sid,qid:S.st.qid,choice:S.sel});}catch(e){} S.pendingSince=Date.now(); }
  },1000);
}
function studentState(m){
  const prevQ=S.st&&S.st.qid, prevPhase=S.st&&S.st.phase;
  S.st=m; if(m.qid!==prevQ){ S.sel=null; S.pendingSince=0; window.scrollTo(0,0); }
  if(m.mine!=null) S.pendingSince=0;
  studentPaint(m.qid!==prevQ || m.phase!==prevPhase);
}
function studentPaint(full){
  if(!S||route.name!=='live') return;
  const dotCls = S.status==='on'?'on':(S.status==='error'?'off':'wait');
  const stxt = S.status==='on'?'Connected':(S.status==='connecting'?'Connecting…':(S.status==='error'?'Error':'Reconnecting…'));
  let body='';
  const st=S.st;
  if(st && st.ver!==VER) body+='<div class="banner">Your page is out of date. Please reload it (pull down, or hard-refresh) to see the current question.</div>';
  if(S.err && S.status!=='on') body+='<div class="banner warn">'+esc(S.err)+'</div>';
  if(!st || st.phase==='lobby' || !byId[st.qid]){
    body+='<div class="card wait"><div class="spin"></div><h2>'+(S.status==='on'?'You’re in!':'Connecting…')+'</h2><p class="muted">'+(S.status==='on'?'Waiting for the lecturer to start the next question…':'Room '+esc(S.code))+'</p></div>';
  } else {
    const q=byId[st.qid], ord=optOrder(q,''), cor=correctOf(q), mine=st.mine, locked=mine!=null || (S.pendingSince>0);
    const reveal=st.phase==='r';
    const myChoice = mine!=null?mine:S.sel;
    const counts=st.counts||[], tot=counts.reduce((a,b)=>a+b,0);
    const opts=ord.map((oi,pos)=>{
      let cls='opt'+(reveal&&tot?' stat':'');
      if(reveal){ if(oi===cor) cls+=' ok'; else if(oi===myChoice) cls+=' bad'; else cls+=' dim'; }
      else if(myChoice===oi) cls+=' sel';
      const pct=tot?Math.round(100*(counts[oi]||0)/tot):0;
      return '<button class="'+cls+'" style="--pct:'+pct+'%" data-act="lsel" data-arg="'+oi+'"'+((reveal||locked)?' disabled':'')+'><span class="k">'+LETTERS[pos]+'</span><span class="t">'+q.opts[oi]+'</span>'+(reveal&&tot?'<span class="cnt">'+pct+'%</span>':'')+'</button>';
    }).join('');
    let foot='';
    if(reveal){
      const ok=mine!=null&&mine===cor, noans=mine==null; const correctN=counts[cor]||0;
      foot='<div class="feedback '+(noans?'':ok?'ok':'bad')+'"><h3>'+(noans?'No answer submitted':ok?'✓ Correct':'✗ Not quite — correct answer: '+LETTERS[ord.indexOf(cor)])+'</h3>'+(tot?'<div class="muted" style="margin-bottom:8px">'+correctN+' of '+tot+' answers were correct ('+Math.round(100*correctN/tot)+' %)</div>':'')+'<div>'+(q.exp||'')+'</div></div>';
    } else if(locked){
      foot='<div class="feedback"><b>✓ Answer '+(mine!=null?'received':'sending…')+'.</b> <span class="muted">Waiting for the lecturer to reveal the solution.</span></div>';
    } else {
      foot='<div class="row" style="margin-top:16px"><button class="btn primary big grow" data-act="lsubmit"'+(S.sel==null?' disabled':'')+'>Submit answer</button></div>';
    }
    body+='<div class="card"><div class="qmeta">Question '+st.n+' of '+st.N+' · '+esc(q.topic)+'</div><div class="qtext">'+q.q+'</div>'+figHTML(q)+'<div class="opts">'+opts+'</div>'+foot+'</div>';
  }
  app.innerHTML='<div class="wrap live">'+header('<span class="status"><i class="dot '+dotCls+'"></i>'+stxt+' · '+esc(S.code)+'</span>')+body+'<p class="muted small" style="margin-top:20px"><button class="link" data-act="home">Leave live quiz</button></p></div>';
  if(!st||full||true) typeset(app);
}
Object.assign(ACTS,{
  lsel(i){ if(!S||!S.st||S.st.phase!=='q'||S.st.mine!=null||S.pendingSince) return; S.sel=+i; studentPaint(); },
  lsubmit(){ if(!S||S.sel==null||!S.st||S.st.phase!=='q'||S.status!=='on') return; try{ S.conn.send({t:'answer',sid:S.sid,qid:S.st.qid,choice:S.sel}); S.pendingSince=Date.now(); studentPaint(); }catch(e){} },
});

/* ====================================================================
   LIVE: PRESENTER (HOST)
   ==================================================================== */
let H=null;
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({length:5},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
const joinURL = () => location.origin+location.pathname+'?join='+H.code;
function hostLoad(){
  const sv=LS.get('sbq.host',{})||{};
  H={ code:sv.code||genCode(), sel:sv.sel||lecNums.slice(), cur:sv.cur||null, phase:sv.phase||'lobby', answers:sv.answers||{},
      conns:new Map(), peer:null, status:'connecting', ui:{overlay:null, exp:false}, tries:0, dead:false };
  if(H.phase!=='lobby' && !byId[H.cur]) { H.phase='lobby'; H.cur=null; }
}
function hostSave(){ LS.set('sbq.host',{code:H.code, sel:H.sel, cur:H.cur, phase:H.phase, answers:H.answers}); }
const hostList = () => QUESTIONS.filter(q=>H.sel.includes(q.lec));
const hostQ = () => H.cur ? byId[H.cur] : null;
function counts(q){ const a=H.answers[q.id]||{}, c=q.opts.map(()=>0); Object.values(a).forEach(v=>{ if(c[v]!=null) c[v]++; }); return c; }
function viewHost(){
  hostLoad(); hostOpenPeer(); hostPaint();
  document.onkeydown=hostKey;
  let idle; const wake=()=>{ document.body.classList.remove('hide-cursor'); clearTimeout(idle); idle=setTimeout(()=>{ if(H&&H.phase!=='lobby'&&!H.ui.overlay) document.body.classList.add('hide-cursor'); },3000); };
  document.onmousemove=wake; H.wake=wake;
}
function hostLeave(){ if(!H) return; H.dead=true; clearTimeout(H.retryT); try{H.peer&&H.peer.destroy();}catch(e){} document.onmousemove=null; H=null; }
function hostOpenPeer(){
  if(!H||H.dead) return;
  if(!window.Peer){ H.status='error:lib'; hostStatus(); H.retryT=setTimeout(hostOpenPeer,3000); return; }
  try{H.peer&&H.peer.destroy();}catch(e){}
  H.conns.clear(); H.status='connecting'; hostStatus();
  const me=H, p=new Peer(PEER_PREFIX+H.code, peerOpts()); H.peer=p;
  p.on('open',()=>{ if(H!==me) return; me.status='open'; me.tries=0; hostStatus(); });
  p.on('error',e=>{
    if(H!==me||me.dead) return;
    if(e.type==='unavailable-id'){ me.status='busy'; hostStatus(); me.retryT=setTimeout(hostOpenPeer, 3500); }
    else if(e.type==='peer-unavailable'){ /* ignore */ }
    else { me.status='error:'+e.type; hostStatus(); me.retryT=setTimeout(hostOpenPeer, 5000); }
  });
  p.on('disconnected',()=>{ if(H!==me) return; me.status='reconnecting'; hostStatus(); try{p.reconnect();}catch(e){} });
  p.on('connection',c=>{
    c.on('data',m=>hostMsg(c,m));
    c.on('close',()=>{ if(c._sid && me.conns.get(c._sid)===c){ me.conns.delete(c._sid); hostCount(); } });
    c.on('error',()=>{});
  });
}
function stateFor(s){
  const q=hostQ(), base={t:'state',ver:VER,code:H.code};
  if(H.phase==='lobby'||!q) return Object.assign(base,{phase:'lobby'});
  const a=H.answers[q.id]||{}, list=hostList();
  const out=Object.assign(base,{phase:H.phase,qid:q.id,n:Math.max(1,list.indexOf(q)+1),N:list.length,mine:(s in a)?a[s]:null});
  if(H.phase==='r'){ out.counts=counts(q); out.correct=correctOf(q); }
  return out;
}
function sendState(c){ try{ if(c.open) c.send(stateFor(c._sid)); }catch(e){} }
function broadcast(){ H.conns.forEach(c=>sendState(c)); }
function hostMsg(c,m){
  if(!m||!H) return;
  if(m.t==='hello' && typeof m.sid==='string'){
    c._sid=m.sid.slice(0,40); const old=H.conns.get(c._sid); if(old&&old!==c){ try{old.close();}catch(e){} }
    H.conns.set(c._sid,c); sendState(c); hostCount();
  } else if(m.t==='answer' && c._sid){
    const q=hostQ(); if(!q||H.phase!=='q'||m.qid!==q.id){ sendState(c); return; }
    const ch=m.choice; if(!Number.isInteger(ch)||ch<0||ch>=q.opts.length) return;
    const a=H.answers[q.id]||(H.answers[q.id]={}); if(!(c._sid in a)) a[c._sid]=ch;
    sendState(c); hostCount(); hostSaveSoon();
  }
}
let saveT; function hostSaveSoon(){ clearTimeout(saveT); saveT=setTimeout(()=>{ if(H) hostSave(); },400); }
window.addEventListener('pagehide',()=>{ if(H) hostSave(); });
function hostCount(){
  if(!H) return; const q=hostQ(); const answered = q? Object.keys(H.answers[q.id]||{}).length : 0;
  document.querySelectorAll('[data-hc]').forEach(el=>el.textContent=H.conns.size);
  document.querySelectorAll('[data-ha]').forEach(el=>el.textContent=answered);
}
function hostStatus(){
  const el=document.getElementById('hstat'); if(!el||!H) return;
  const s=H.status; let txt, cls;
  if(s==='open'){ txt='Room online'; cls='on'; }
  else if(s==='connecting'||s==='reconnecting'){ txt='Connecting to the signalling server…'; cls='wait'; }
  else if(s==='busy'){ txt='Room code still held by a previous page — retrying…'; cls='wait'; }
  else if(s==='error:lib'){ txt='Connection library not loaded (offline?)'; cls='off'; }
  else { txt='Connection problem ('+s.replace('error:','')+') — retrying…'; cls='off'; }
  el.innerHTML='<i class="dot '+cls+'"></i> '+txt;
}
function setPhase(ph,id){
  H.phase=ph; if(id!==undefined) H.cur=id;
  hostSave(); broadcast(); hostPaint();
}
function hostAdvance(){
  const list=hostList(); if(!list.length) return;
  if(H.phase==='lobby'){ setPhase('q', H.cur && byId[H.cur] && list.includes(byId[H.cur]) ? H.cur : list[0].id); }
  else if(H.phase==='q'){ setPhase('r'); }
  else { const i=list.indexOf(hostQ()); if(i+1<list.length) setPhase('q',list[i+1].id); else { H.ui.overlay='list'; hostPaint(); } }
  if(H.wake) H.wake();
}
function hostBack(){
  const list=hostList();
  if(H.phase==='r') setPhase('q');
  else if(H.phase==='q'){ const i=list.indexOf(hostQ()); if(i>0) setPhase('r',list[i-1].id); else setPhase('lobby'); }
}
function hostKey(e){
  if(!H||e.ctrlKey||e.metaKey||e.altKey) return; const k=e.key;
  if(H.ui.overlay && k==='Escape'){ H.ui.overlay=null; hostPaint(); return; }
  if(H.phase==='lobby') { if(k==='Enter'){ hostAdvance(); } return; }
  if(k===' '||k==='ArrowRight'||k==='Enter'||k==='PageDown'){ e.preventDefault(); if(!H.ui.overlay) hostAdvance(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); if(!H.ui.overlay) hostBack(); }
  else if(k==='r'||k==='R'){ if(H.phase==='q') setPhase('r'); }
  else if(k==='e'||k==='E'){ H.ui.exp=!H.ui.exp; hostPaint(); }
  else if(k==='q'||k==='Q'){ H.ui.overlay=H.ui.overlay==='qr'?null:'qr'; hostPaint(); }
  else if(k==='l'||k==='L'||k==='g'||k==='G'){ H.ui.overlay=H.ui.overlay==='list'?null:'list'; hostPaint(); }
  else if(k==='f'||k==='F'){ ACTS.hfull(); }
}
Object.assign(ACTS,{
  hnext(){ hostAdvance(); }, hprev(){ hostBack(); },
  hexp(){ H.ui.exp=!H.ui.exp; hostPaint(); },
  hqr(){ H.ui.overlay='qr'; hostPaint(); },
  hlist(){ H.ui.overlay='list'; hostPaint(); },
  hclose(){ H.ui.overlay=null; hostPaint(); },
  hfull(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} },
  hjump(id){ H.ui.overlay=null; setPhase('q',id); },
  hchip(n){ n=+n; const i=H.sel.indexOf(n); if(i>=0) H.sel.splice(i,1); else H.sel.push(n); H.sel.sort((a,b)=>a-b); hostSave(); hostPaint(); },
  hlobby(){ H.ui.overlay=null; setPhase('lobby'); },
  hnewroom(){ if(!confirm('Create a new room code? Students currently connected will have to rejoin, and collected answers are cleared.')) return; H.code=genCode(); H.answers={}; H.cur=null; H.phase='lobby'; hostSave(); hostOpenPeer(); hostPaint(); },
  hreset(){ if(!confirm('Clear all collected answers of this session?')) return; H.answers={}; hostSave(); broadcast(); hostPaint(); },
  hcsv(){ hostCSV(); },
  hcopy(){ try{ navigator.clipboard.writeText(joinURL()); }catch(e){} },
});
function hostCSV(){
  const rows=[['id','lecture','topic','n_answers','n_correct','pct_correct','correct_option_(original_index)']];
  const maxO=Math.max.apply(null,QUESTIONS.map(q=>q.opts.length)); for(let i=0;i<maxO;i++) rows[0].push('count_option_'+i);
  QUESTIONS.forEach(q=>{ if(!H.answers[q.id]) return; const c=counts(q), n=c.reduce((a,b)=>a+b,0); if(!n) return; const k=c[correctOf(q)]; rows.push([q.id,q.lec,q.topic,n,k,(100*k/n).toFixed(1),correctOf(q)].concat(c)); });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='live-quiz-results-'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function qrSvg(text){
  if(!window.qrcode) return '<div style="padding:40px;color:#444;line-height:1.3">QR code library not loaded.<br>Share the link instead.</div>';
  const qr=qrcode(0,'M'); qr.addData(text); qr.make(); const n=qr.getModuleCount(); let d='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) d+='M'+(c+4)+','+(r+4)+'h1v1h-1z';
  return '<svg viewBox="0 0 '+(n+8)+' '+(n+8)+'" shape-rendering="crispEdges" role="img" aria-label="QR code to join"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}
function hostPaint(){
  if(!H||route.name!=='host') return;
  const q=hostQ(), list=hostList(), url=joinURL();
  const fileWarn = location.protocol==='file:' ? '<div class="banner" style="margin:0 0 12px">This page was opened from a local file. Students cannot reach it — publish it (e.g. GitHub Pages) and open that address, otherwise the QR code will not work.</div>' : '';
  let html='';
  if(H.phase==='lobby' || !q){
    const chips=lecNums.map(n=>{ const c=QUESTIONS.filter(x=>x.lec===n).length; if(!c) return ''; return '<button class="chip'+(H.sel.includes(n)?' on':'')+'" data-act="hchip" data-arg="'+n+'"><b>'+esc(lecLabel(n))+'</b><span>'+c+' questions</span></button>'; }).join('');
    html='<div class="proj"><div class="ph"><span class="brand" data-act="home" style="font-size:1em">'+esc(TITLE)+' · Live quiz</span><span class="sp"></span><span id="hstat" class="status"></span><button class="btn ghost" data-act="theme" aria-label="Toggle theme">'+THEME_ICON+'</button></div>'+
      '<div class="lobby"><div>'+fileWarn+'<div class="qrbox">'+qrSvg(url)+'</div></div>'+
      '<div class="stack" style="min-width:0"><div class="muted">Scan the QR code, or go to</div><div class="joinurl">'+esc(location.host+location.pathname.replace(/index\.html$/,''))+'</div><div class="muted">and enter the code</div><div class="code">'+H.code+'</div>'+
      '<div><span class="bigcount" data-hc>'+H.conns.size+'</span> <span class="muted">connected</span></div>'+
      '<div><div class="muted small" style="margin-bottom:8px">Questions to ask in this session</div><div class="chips">'+chips+'</div></div>'+
      '<div class="row"><button class="btn primary big" data-act="hnext"'+(list.length?'':' disabled')+'>'+(q?'Resume':'Start')+' quiz ▶ <span class="small" style="opacity:.8">('+list.length+' questions)</span></button><button class="btn ghost" data-act="hnewroom">New room code</button><button class="btn ghost" data-act="hcopy">Copy link</button></div></div></div></div>';
  } else {
    const idx=list.indexOf(q)+1, rev=H.phase==='r', cs=counts(q), tot=cs.reduce((a,b)=>a+b,0), cor=correctOf(q), ord=optOrder(q,'');
    const opts=ord.map((oi,pos)=>{
      let cls='opt'; if(rev){ cls+=' stat'+(oi===cor?' ok':' dim'); }
      const pct=tot?Math.round(100*cs[oi]/tot):0;
      return '<div class="'+cls+'" style="--pct:'+pct+'%"><span class="k">'+LETTERS[pos]+'</span><span class="t">'+q.opts[oi]+'</span>'+(rev?'<span class="cnt">'+cs[oi]+' · '+pct+'%</span>':'')+'</div>';
    }).join('');
    let tally=''; if(rev){ const k=cs[cor], w=tot-k, noans=Math.max(0,H.conns.size-tot); tally='<div class="tally"><span class="ok">✓ '+k+' correct'+(tot?' ('+Math.round(100*k/tot)+' %)':'')+'</span><span class="bad">✗ '+w+' wrong'+(tot?' ('+Math.round(100*w/tot)+' %)':'')+'</span>'+(noans?'<span class="no">'+noans+' no answer</span>':'')+'</div>'; }
    const exp = rev && H.ui.exp ? '<div class="feedback" style="margin-top:18px"><div>'+(q.exp||'')+'</div>'+(q.src?'<div class="src">Modelled on: '+esc(q.src)+'</div>':'')+'</div>' : '';
    html='<div class="proj"><div class="ph"><span class="lec">'+esc(lecLabel(q.lec))+'</span><span class="muted">·</span><span>Question '+idx+' / '+list.length+'</span><span class="sp"></span>'+
      '<span id="hstat" class="status"></span><span class="pill">'+(rev?'Results':'<span data-ha>0</span> answered')+' · <span data-hc>'+H.conns.size+'</span> online</span></div>'+
      '<div class="pm'+(q.fig?' hasfig':'')+'"><div><div class="qtext">'+q.q+'</div><div class="opts">'+opts+'</div>'+tally+exp+'</div>'+(q.fig?figHTML(q):'')+'</div>'+
      '<div class="pf"><span class="info">Join: <b>'+esc(location.host+location.pathname.replace(/index\.html$/,''))+'</b> · code <b>'+H.code+'</b></span>'+
      '<button class="btn" data-act="hprev" title="← Back">◀</button>'+
      '<button class="btn primary" data-act="hnext" title="Space / →">'+(rev?(idx<list.length?'Next question ▶':'Finish'):'Reveal answer')+'</button>'+
      (rev?'<button class="btn" data-act="hexp" title="E">'+(H.ui.exp?'Hide':'Show')+' explanation</button>':'')+
      '<button class="btn" data-act="hlist" title="L">Questions</button><button class="btn" data-act="hqr" title="Q">QR code</button><button class="btn" data-act="hfull" title="F">⛶</button><button class="btn ghost" data-act="theme" aria-label="Toggle theme">'+THEME_ICON+'</button></div></div>';
  }
  // overlays
  if(H.ui.overlay==='qr'){
    html+='<div class="overlay" data-act="hclose"><div class="modal" style="text-align:center" onclick="event.stopPropagation()"><div class="qrbox">'+qrSvg(url)+'</div><div class="code" style="margin-top:14px">'+H.code+'</div><div class="joinurl" style="margin-top:8px">'+esc(url)+'</div></div></div>';
  } else if(H.ui.overlay==='list'){
    const cur=hostQ();
    const items=list.map(x=>{ const a=H.answers[x.id], n=a?Object.keys(a).length:0; let st=''; if(n){ const c=counts(x); st=Math.round(100*c[correctOf(x)]/n)+' % of '+n; }
      return '<button class="qli'+(cur&&cur.id===x.id?' cur':'')+'" data-act="hjump" data-arg="'+x.id+'"><span class="id">'+x.id+'</span><span class="tp">'+esc(x.topic)+'</span><span class="st">'+st+'</span></button>'; }).join('');
    const chips=lecNums.map(n=>{ const c=QUESTIONS.filter(x=>x.lec===n).length; return c?'<button class="chip'+(H.sel.includes(n)?' on':'')+'" style="min-width:0;flex:0 1 auto;padding:6px 10px" data-act="hchip" data-arg="'+n+'"><b>'+(n===7?'More':'L'+n)+'</b></button>':''; }).join('');
    html+='<div class="overlay" data-act="hclose"><div class="modal" onclick="event.stopPropagation()"><div class="row spread" style="margin-bottom:12px"><h2>Questions</h2><div class="row"><button class="btn" data-act="hcsv">Download results (CSV)</button><button class="btn" data-act="hlobby">Lobby / QR</button><button class="btn primary" data-act="hclose">Close</button></div></div><div class="chips" style="margin-bottom:12px">'+chips+'</div><div class="qlist">'+items+'</div><p class="muted small" style="margin-top:14px"><button class="link" data-act="hreset">Clear collected answers</button></p></div></div>';
  }
  app.innerHTML=html; hostStatus(); hostCount(); typeset(app);
}

   START
   ==================================================================== */
const start=()=>iceReady.then(bootRoute);
if(document.readyState==='loading') window.addEventListener('DOMContentLoaded', start); else start();
window.addEventListener('popstate', ()=>{ cleanup(); bootRoute(); });
})();
